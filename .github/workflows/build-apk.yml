# Compila l'APK nel cloud di GitHub a ogni push: niente Android Studio sul tuo computer.
# Risultato: release "latest" con app-debug.apk da scaricare e installare sulla TV.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Allega l'APK all'esecuzione
        uses: actions/upload-artifact@v4
        with:
          name: VodTv-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Copia pubblica senza login: ramo "apk" con il solo file app.apk
      #   https://raw.githubusercontent.com/<repo>/apk/app.apk
      #   https://cdn.jsdelivr.net/gh/<repo>@apk/app.apk
      - name: Pubblica l'APK sul ramo "apk"
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/app.apk
          cd out
          git init -q -b apk
          git add app.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@apk/app.apk" > /dev/null || true

      - name: Pubblica nella release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ultima versione
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
